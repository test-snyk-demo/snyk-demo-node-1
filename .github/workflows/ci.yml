# CI on test-snyk-demo/reusable-workflows js-ci.yaml@v7: build, Snyk Open Source + Code, then on main:
# Docker build (hardened image) -> Snyk Container gate -> push to GHCR. A pushed image triggers the
# Secure deploy workflow through a repository_dispatch event (image-pushed). On PRs, Snyk Autofix
# then opens a fix PR with Snyk's upgrades for the dependency issues the PR introduces.
name: CI
on:
  push:
    branches: [main, "hotfix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  packages: write
jobs:
  ci:
    uses: test-snyk-demo/reusable-workflows/.github/workflows/js-ci.yaml@v7
    with:
      node-version: "18"
      docker-build: true
      docker-file: Dockerfile.secure
      docker-image-name: goof-secure
      container-fail-on-issues: true
      container-exclude-app-vulns: true
    secrets:
      snyk-token: ${{ secrets.SNYK_TOKEN }}

  autofix:
    name: Snyk Autofix
    needs: ci
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'snyk-autofix/')
    permissions:
      contents: write
      pull-requests: write
    uses: test-snyk-demo/reusable-workflows/.github/workflows/snyk-autofix.yaml@v8
    with:
      node-version: "18"
      dockerfile: Dockerfile.secure
    secrets:
      snyk-token: ${{ secrets.SNYK_TOKEN }}
      app-token: ${{ secrets.AUTOFIX_APP_TOKEN }}

  trigger-deploy:
    name: Trigger secure deploy
    needs: ci
    if: ${{ success() && needs.ci.outputs.image-digest != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Send repository_dispatch (image-pushed)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.ci.outputs.image-ref }}
          DIGEST: ${{ needs.ci.outputs.image-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=image-pushed \
            -f "client_payload[image]=$IMAGE" -f "client_payload[digest]=$DIGEST" -f "client_payload[sha]=$GITHUB_SHA"
          echo "Triggered Secure deploy for \`$IMAGE\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
